<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUJI · KAITASHI — Theo dõi view video</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b5fff%27/%3E%3Cpath d=%27M7 22l6-7 4 4 8-10%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div>
      <h1>Bảng theo dõi view video</h1>
      <p class="sub">YouTube Shorts · TikTok · Facebook Reels · Instagram Reels</p>
    </div>
    <div class="top-right">
      <label class="chk"><input type="checkbox" id="onlyMatched" checked> Chỉ tính video trùng ≥ 2 nền tảng</label>
      <div class="live"><span class="dot" id="dot"></span><span id="updated">Đang tải…</span></div>
    </div>
  </div>
</header>

<main class="wrap" id="app"><p class="muted">Đang tải dữ liệu…</p></main>

<footer class="wrap foot">
  Dữ liệu được máy chủ tự thu thập định kỳ (~30 phút/lần) từ các trang công khai; trang tự làm mới mỗi 60 giây.
  Facebook chỉ hiển thị số view làm tròn khi ≥ 1.000 (VD “3,1K”).
</footer>

<script src="chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
